<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>DOMino Inmobiliaria · Nueva captación</title>
<meta name="theme-color" content="#0A0A0A">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" href="imagenes/favicon-64.png">
<link rel="apple-touch-icon" href="imagenes/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600&family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="app.css">
</head>
<body>
<div class="page">
  <div class="head">
    <a class="back" href="dashboard.html" aria-label="Volver al panel"><svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg></a>
    <h2>Nueva captación</h2>
  </div>

  <div class="shot" id="shot">
    <div class="ph">
      <svg viewBox="0 0 24 24"><path d="M4 8h3l2-3h6l2 3h3v11H4zM12 17a3.5 3.5 0 100-7 3.5 3.5 0 000 7z"/></svg>
      <b>Abrir cámara</b>
      <span>Toque para fotografiar la propiedad</span>
    </div>
    <span class="retake">Cambiar foto</span>
    <input type="file" id="foto" accept="image/*" capture="environment" aria-label="Fotografiar la propiedad">
  </div>

  <form id="f" novalidate>
    <div class="field"><label for="dir">Dirección de la propiedad</label><input id="dir" type="text" placeholder="Ej.: San Martín 1234, Godoy Cruz" autocomplete="street-address" required></div>
    <div class="field"><label for="op">Tipo de operación</label>
      <select id="op"><option>Solo tasación</option><option>Venta exclusiva</option><option>Alquiler</option></select></div>
    <button class="btn" type="submit">Subir al sistema</button>
    <p class="msg" id="msg" role="status" aria-live="polite"></p>
  </form>
</div>

<script src="app.js"></script>
<script>
(function () {
  var $ = function (id) { return document.getElementById(id); };
  var foto = '';

  function mostrar(url) { foto = url || ''; var s = $('shot'); if (foto) { s.style.backgroundImage = 'url("' + foto + '")'; s.classList.add('has'); } else { s.style.backgroundImage = ''; s.classList.remove('has'); } }
  try { var pend = sessionStorage.getItem('domino_foto'); if (pend) { mostrar(pend); sessionStorage.removeItem('domino_foto'); } } catch (e) {}

  $('foto').addEventListener('change', function () {
    var f = this.files && this.files[0]; if (!f) return;
    DI.reducir(f).then(mostrar).catch(function () { $('msg').className = 'msg er'; $('msg').textContent = 'No se pudo leer la foto. Pruebe con otra.'; });
  });

  $('f').addEventListener('submit', function (e) {
    e.preventDefault();
    var dir = $('dir').value.trim(), msg = $('msg');
    if (dir.length < 3) { msg.className = 'msg er'; msg.textContent = 'Escriba la dirección de la propiedad.'; $('dir').focus(); return; }
    var d = DI.load();
    d.props.unshift({ id: 'n' + Date.now(), titulo: dir, estado: 'Nueva · ' + $('op').value, img: foto });
    if (!DI.save(d)) { // si el teléfono no tiene lugar para la foto, se guarda sin ella
      d.props[0].img = ''; if (!DI.save(d)) { msg.className = 'msg er'; msg.textContent = 'No se pudo guardar en este teléfono.'; return; }
    }
    location.href = 'dashboard.html';
  });
})();
</script>
</body>
</html>
