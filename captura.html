<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>DOMino Inmobiliaria · Nueva captación</title>
<meta name="theme-color" content="#0A0A0A">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" href="imagenes/favicon-64.png">
<link rel="apple-touch-icon" href="imagenes/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600&family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="app.css">
</head>
<body>
<div class="page">
  <div class="head">
    <a class="back" href="dashboard.html" aria-label="Volver al panel"><svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg></a>
    <h2>Nueva captación</h2>
  </div>

  <div class="shot" id="shot">
    <div class="ph">
      <svg viewBox="0 0 24 24"><path d="M4 8h3l2-3h6l2 3h3v11H4zM12 17a3.5 3.5 0 100-7 3.5 3.5 0 000 7z"/></svg>
      <b>Abrir cámara</b>
      <span>Toque para fotografiar la propiedad</span>
    </div>
    <span class="retake">Cambiar foto</span>
    <input type="file" id="foto" accept="image/*" capture="environment" aria-label="Fotografiar la propiedad">
  </div>

  <form id="f" novalidate>
    <div class="field"><label for="dir">Dirección de la propiedad</label><input id="dir" type="text" placeholder="Ej.: San Martín 1234, Godoy Cruz" autocomplete="street-address" required></div>
    <div class="field"><label for="op">Tipo de operación</label>
      <select id="op"><option>Solo tasación</option><option>Venta exclusiva</option><option>Alquiler</option></select></div>
    <div class="field"><label for="pn">Propietario (opcional)</label><input id="pn" type="text" autocomplete="off" placeholder="Nombre y apellido"></div>
    <div class="field"><label for="pt">WhatsApp del propietario (opcional)</label><input id="pt" type="tel" inputmode="tel" autocomplete="off" placeholder="2615551234 (con código de área, sin 0 ni 15)"></div>
    <div class="field" id="asig-box" hidden><label for="asig">A cargo de</label><select id="asig"></select></div>
    <button class="btn" type="submit" id="go">Subir al sistema</button>
    <p class="msg" id="msg" role="status" aria-live="polite"></p>
  </form>
</div>

<script src="app.js"></script>
<script type="module">
import { iniciar } from './datos.js';
const $ = id => document.getElementById(id), DI = window.DI;
let foto = '', ctx = null;
const msg = (t, k) => { $('msg').className = 'msg ' + (k || ''); $('msg').textContent = t; };
function mostrar(url) { foto = url || ''; const s = $('shot'); if (foto) { s.style.backgroundImage = 'url("' + foto + '")'; s.classList.add('has'); } else { s.style.backgroundImage = ''; s.classList.remove('has'); } }

(async () => {
  ctx = await iniciar(); if (!ctx) return;
  if (ctx.esSenior) { try { const ps = await ctx.equipo(); if (ps.length > 1) { $('asig').innerHTML = ps.map(u => '<option value="' + DI.esc(u.email) + '"' + (u.email === ctx.mail ? ' selected' : '') + '>' + DI.esc(u.nombre) + ' · ' + (DI.ROLES[u.rol] || '') + '</option>').join(''); $('asig-box').hidden = false; } } catch (e) {} }
  try { const pend = sessionStorage.getItem('domino_foto'); if (pend) { mostrar(pend); sessionStorage.removeItem('domino_foto'); } } catch (e) {}
  $('foto').addEventListener('change', function () {
    const f = this.files && this.files[0]; if (!f) return;
    DI.reducir(f).then(mostrar).catch(() => msg('No se pudo leer la foto. Pruebe con otra.', 'er'));
  });
  $('f').addEventListener('submit', async e => {
    e.preventDefault();
    const dir = $('dir').value.trim(), pt = $('pt').value.trim();
    if (dir.length < 3) { msg('Escriba la dirección de la propiedad.', 'er'); $('dir').focus(); return; }
    if (pt && !DI.tel(pt)) { msg('Revise el WhatsApp: código de área y número, sin 0 ni 15.', 'er'); $('pt').focus(); return; }
    $('go').disabled = true; msg('Guardando…');
    const prop = { titulo: dir, estado: 'Nueva · ' + $('op').value, operacion: $('op').value, img: foto, propietario: $('pn').value.trim(), propietario_tel: pt ? DI.tel(pt) : '' };
    if (!$('asig-box').hidden) prop.asignado = $('asig').value;
    try { await ctx.agregarProp(prop); }
    catch (err) { $('go').disabled = false; msg('No se pudo guardar (' + (err.code || err.message) + ').', 'er'); return; }
    location.href = 'dashboard.html';
  });
})();
</script>
</body>
</html>
